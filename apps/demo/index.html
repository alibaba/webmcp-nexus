<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
    <!-- relay 只读 document.modelContext，靠 getTools() 发现工具、executeTool() 调用工具。
         跟随 @latest：relay 6.x 起 executeTool 传对象入参（原生 Chrome 155+ 只接受对象），
         钉旧大版本会让页面侧与 relay server 侧（npx @latest）形态错配。
         必须是经典同步 script：embed.js 靠 document.currentScript 读 data-* 属性，
         加 type="module" / defer / async 会让全部属性静默失效。
         自托管时必须同时提供同目录的 widget.html，否则 relay fails closed。 -->
    <script src="https://cdn.jsdelivr.net/npm/@mcp-b/webmcp-local-relay@latest/dist/browser/embed.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
